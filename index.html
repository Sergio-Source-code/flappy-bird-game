<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #4ec0ca;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: manipulation;
  }
  #gameCanvas {
    background: #4ec0ca;
    border: 4px solid #333;
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
  #overlay {
    position: absolute;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="360" height="640"></canvas>
<div id="overlay"></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const W = canvas.width;
const H = canvas.height;

// ---- Game constants ----
const GRAVITY = 0.45;
const FLAP_STRENGTH = -8;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 90; // frames between pipes
const GROUND_HEIGHT = 80;

// ---- Game state ----
let bird, pipes, frame, score, best, state; // state: 'ready' | 'playing' | 'over'

function loadBest() {
  return parseInt(localStorage.getItem('flappyBest') || '0', 10);
}
function saveBest(v) {
  localStorage.setItem('flappyBest', v);
}

function resetGame() {
  bird = { x: W * 0.3, y: H / 2, vy: 0, radius: 14, rotation: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  state = 'ready';
}

best = loadBest();
resetGame();

// ---- Input ----
function flap() {
  if (state === 'ready') {
    state = 'playing';
    bird.vy = FLAP_STRENGTH;
  } else if (state === 'playing') {
    bird.vy = FLAP_STRENGTH;
  } else if (state === 'over') {
    resetGame();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flap();
}, { passive: false });

// ---- Pipe generation ----
function spawnPipe() {
  const margin = 60;
  const topHeight = margin + Math.random() * (H - GROUND_HEIGHT - PIPE_GAP - margin * 2);
  pipes.push({
    x: W,
    top: topHeight,
    bottom: topHeight + PIPE_GAP,
    passed: false
  });
}

// ---- Collision ----
function checkCollision() {
  // Ground / ceiling
  if (bird.y + bird.radius >= H - GROUND_HEIGHT) return true;
  if (bird.y - bird.radius <= 0) return true;

  for (const p of pipes) {
    const withinX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH;
    if (withinX) {
      if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
        return true;
      }
    }
  }
  return false;
}

// ---- Update ----
function update() {
  if (state !== 'playing') return;

  frame++;
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

  if (frame % PIPE_INTERVAL === 0) spawnPipe();

  for (const p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

  if (checkCollision()) {
    state = 'over';
    if (score > best) {
      best = score;
      saveBest(best);
    }
  }
}

// ---- Draw ----
function drawBackground() {
  ctx.fillStyle = '#4ec0ca';
  ctx.fillRect(0, 0, W, H);

  // clouds (simple)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 3; i++) {
    const cx = (i * 150 + (frame * 0.2) % 400) % (W + 100) - 50;
    ctx.beginPath();
    ctx.ellipse(cx, 80 + i * 40, 30, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPipes() {
  ctx.fillStyle = '#5cb95c';
  ctx.strokeStyle = '#3a7a3a';
  ctx.lineWidth = 3;
  for (const p of pipes) {
    // top pipe
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
    // bottom pipe
    ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, H - GROUND_HEIGHT - p.bottom);
    ctx.strokeRect(p.x, p.bottom, PIPE_WIDTH, H - GROUND_HEIGHT - p.bottom);
    // pipe caps
    ctx.fillRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);
    ctx.strokeRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);
    ctx.fillRect(p.x - 4, p.bottom, PIPE_WIDTH + 8, 20);
    ctx.strokeRect(p.x - 4, p.bottom, PIPE_WIDTH + 8, 20);
  }
}

function drawGround() {
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
  ctx.fillStyle = '#c8b968';
  const stripeW = 40;
  const offset = (frame * PIPE_SPEED) % stripeW;
  for (let x = -offset; x < W; x += stripeW) {
    ctx.fillRect(x, H - GROUND_HEIGHT, stripeW / 2, 10);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);
  ctx.fillStyle = '#f7d51d';
  ctx.strokeStyle = '#c9a70e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.radius, bird.radius * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // eye
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bird.radius * 0.4, -bird.radius * 0.3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // beak
  ctx.fillStyle = '#ff8c00';
  ctx.beginPath();
  ctx.moveTo(bird.radius * 0.6, 0);
  ctx.lineTo(bird.radius * 1.4, -3);
  ctx.lineTo(bird.radius * 1.4, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawScore() {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 40px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.strokeText(score, W / 2, 60);
  ctx.fillText(score, W / 2, 60);
}

function drawMessages() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;

  if (state === 'ready') {
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 60);
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 60);
    ctx.font = '18px "Courier New", monospace';
    ctx.strokeText('Tap / Click / Space', W / 2, H / 2 - 20);
    ctx.fillText('Tap / Click / Space', W / 2, H / 2 - 20);
    ctx.strokeText('to flap', W / 2, H / 2 + 5);
    ctx.fillText('to flap', W / 2, H / 2 + 5);
  } else if (state === 'over') {
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.strokeText('Game Over', W / 2, H / 2 - 60);
    ctx.fillText('Game Over', W / 2, H / 2 - 60);
    ctx.font = '20px "Courier New", monospace';
    ctx.strokeText('Score: ' + score, W / 2, H / 2 - 20);
    ctx.fillText('Score: ' + score, W / 2, H / 2 - 20);
    ctx.strokeText('Best: ' + best, W / 2, H / 2 + 10);
    ctx.fillText('Best: ' + best, W / 2, H / 2 + 10);
    ctx.font = '16px "Courier New", monospace';
    ctx.strokeText('Tap to restart', W / 2, H / 2 + 50);
    ctx.fillText('Tap to restart', W / 2, H / 2 + 50);
  }
}

function draw() {
  drawBackground();
  drawPipes();
  drawGround();
  drawBird();
  drawScore();
  drawMessages();
}

// ---- Main loop ----
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
